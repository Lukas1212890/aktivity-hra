<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d64"><title>Aktivity</title><style>

#pathSvg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.routeShadow{fill:none;stroke:#4f311e;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.55}.route{fill:none;stroke:#fff7dd;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1}.fieldLayer{position:absolute;inset:0;z-index:4}.cell{position:absolute;width:clamp(20px,3.8vw,38px);height:clamp(20px,3.8vw,38px);transform:translate(-50%,-50%);border:2px solid #fff;border-radius:9px;box-shadow:0 2px 0 #0003,0 2px 6px #0003;display:grid;place-items:center;font-weight:1000}.cell.start{width:clamp(26px,4.8vw,48px);height:clamp(26px,4.8vw,48px);border-radius:50%;outline:3px solid #5c3c22}.cell.finish{width:clamp(30px,5vw,52px);height:clamp(30px,5vw,52px);border-radius:50%;outline:4px solid #be2028;box-shadow:0 0 0 4px #fff7,0 3px 8px #0005}.c0{background:var(--y)}.c1{background:var(--c)}.c2{background:var(--p);color:#fff}.c3{background:var(--g)}.c4{background:var(--b);color:#fff}.c5{background:var(--o)}.num{position:absolute;left:2px;top:0;font-size:6px;opacity:.6}.cellIcon{font-size:clamp(10px,1.8vw,17px)}.pieces{position:absolute;right:-10px;bottom:-10px;display:flex;gap:2px;z-index:10;flex-wrap:wrap;max-width:52px}.piece{width:22px;height:22px;border-radius:50%;border:2px solid white;color:#fff;font-size:9px;font-weight:1000;display:grid;place-items:center;box-shadow:0 2px 5px #0009,0 0 0 1px #0004}.p0{background:#d6323b}.p1{background:#1267c7}.p2{background:#2e9b48}.p3{background:#7b42b0}.sign{position:absolute;z-index:6;background:#7b4b2b;color:#fff;border:2px solid #4d2d19;border-radius:7px;padding:3px 7px;font-weight:1000;font-size:clamp(8px,1.4vw,13px);box-shadow:0 2px 4px #0004}.startSign{left:2%;bottom:7%;transform:rotate(-4deg)}.finishSign{right:2%;top:20%;background:#bd2d2d;border-color:#7a1919;transform:rotate(2deg)}
.control{flex:0 0 auto;background:linear-gradient(#5c3b27,#3f281b);border:3px solid #2d1b12;border-radius:15px;padding:6px;color:white;box-shadow:0 4px 0 #24170f}.dicebox{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:58px}.die{font-size:38px;line-height:1}.card{background:#fffdf5;color:var(--ink);border-radius:12px;overflow:hidden}.head{background:#173d64;color:#fff;padding:5px 7px;display:flex;justify-content:space-between;gap:5px;align-items:center;font-size:9px;font-weight:1000}.timer{background:#fff;color:#183c62;border-radius:999px;padding:3px 7px;font-size:13px;font-variant-numeric:tabular-nums}.timer.danger{background:#d9363e;color:#fff;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.rows{display:grid;grid-template-columns:repeat(3,1fr)}.row{display:grid;grid-template-columns:28px 1fr;min-height:34px;border:1px solid #0001}.rowIcon{display:grid;place-items:center;font-size:14px}.word{padding:4px 5px;font-size:9px;font-weight:900;line-height:1.05;display:flex;align-items:center;justify-content:space-between;gap:4px}.act{font-size:7px;opacity:.55}.active{outline:3px solid #172033;outline-offset:-3px}.answerRow{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-top:5px}.guessers{display:flex;gap:5px;flex-wrap:wrap}.guess{padding:7px 10px;border-radius:9px;background:#f1f1f1;font-size:10px}.result{display:flex;gap:4px}.no{padding:7px 10px;border-radius:9px;color:#fff;font-size:10px;background:#c64040}.timeup{background:#ffe4e4;color:#a01e26;border-radius:7px;padding:3px 6px;font-size:9px;font-weight:1000;margin-top:4px}
@media(max-width:650px){main{padding:3px;gap:3px}.topbar{min-height:40px}.brand{font-size:20px;padding:4px 7px}.brand small{display:none}.turnbox{min-width:82px;padding:4px 6px}.turn{font-size:12px}.score{font-size:8px;padding:4px 5px}.smallbtn{padding:6px 7px;font-size:9px}.game{gap:3px}.mapPanel{border-radius:12px}.control{padding:4px}.dicebox{min-height:48px}.die{font-size:30px}.roll{padding:8px 10px;font-size:11px}.rows{grid-template-columns:repeat(2,1fr)}.row{min-height:27px}.word{font-size:8px}.rowIcon{font-size:12px}.answerRow{align-items:stretch}.guess{font-size:9px;padding:6px 8px}.castle{top:4%}.finishSign{top:16%}.piece{width:20px;height:20px;font-size:8px;border-width:2px}.pieces{right:-9px;bottom:-9px;max-width:46px}}
</style></head><body><main>
<section id="setup" class="setup"><h1>🎲 AKTIVITY</h1><div style="font-weight:800;margin-bottom:8px">Dobrodružství od STARTU až k hradu.</div><label>Počet hráčů<select id="count"><option value="3">3 hráči</option><option value="4">4 hráči</option></select></label><div id="names" class="names"></div><button id="start" class="primary" style="width:100%">ZAČÍT HRU</button></section>
<section id="play" class="hidden" style="height:100%;display:flex;flex-direction:column;gap:5px"><div class="topbar"><div class="brand">AKTIVITY<small>ZÁBAVA, KTERÁ SPOJUJE</small></div><div class="turnbox"><div class="muted">👑 Na tahu</div><div id="turn" class="turn"></div></div><div id="scores" class="scores"></div><button id="reset" class="smallbtn">Nová hra</button></div><div class="game"><div class="mapPanel"><div class="hill"></div><div class="hill2"></div><div class="river"></div><div class="river2"></div><div class="dune"></div><div class="mountains">🏔️🏔️</div><div class="forest">🌲🌲🌲</div><div class="water">🌊</div><div class="desert">🌴</div><div class="castle">🏰</div><div class="village">🏘️</div><div class="bridge">🌉</div><div class="boat">⛵</div><div class="pyramid">🔺</div><div class="sun">☀️</div><svg id="pathSvg" viewBox="0 0 1000 600" preserveAspectRatio="none"><polyline id="routeShadow" class="routeShadow" points=""></polyline><polyline id="route" class="route" points=""></polyline></svg><div class="sign startSign">START</div><div class="sign finishSign">🏆 CÍL</div><div id="fieldLayer" class="fieldLayer"></div></div><div class="control"><div id="diceStep" class="dicebox"><div><b>Hoď kostkou</b><div class="muted" style="color:#fff">1–2 = obtížnost 3 · 3–4 = obtížnost 4 · 5–6 = obtížnost 5</div></div><div style="display:flex;align-items:center;gap:7px"><div id="die" class="die">⚀</div><button id="roll" class="roll">HODIT</button></div></div><div id="cardStep" class="hidden"><div class="card"><div class="head"><span id="ctitle"></span><span id="target"></span><span id="timer" class="timer">1:05</span></div><div id="rows" class="rows"></div></div><div id="timeup" class="timeup hidden">⏰ ČAS VYPRŠEL!</div><div class="answerRow"><div id="guessers" class="guessers"></div><button id="no" class="no">✕ NEUHODNUTO</button></div></div></div></div></section></section></main>
<script>
const $=id=>document.getElementById(id);const COLORS=[['c0','🎨','Kreslení','draw'],['c1','💬','Mluvení','talk'],['c2','🎭','Pantomima','mime'],['c3','🎨','Kreslení','draw'],['c4','💬','Mluvení','talk'],['c5','🎭','Pantomima','mime']];
const P={3:{draw:['Kompas','Traktor','Akvárium','Rozhledna','Pirátská loď','Horkovzdušný balón','Ptačí budka','Větrný mlýn','Semafor','Dalekohled','Sněhulák','Slunečnice','Vesmírná raketa','Kurník','Přístav','Plachetnice','Knihovna','Stromový domek','Pískoviště','Stodola','Kávovar','Kytara','Fotoaparát','Žebřík','Padák','Maják','Vodopád','Hrad','Skleník','Vrtulník'],talk:['Reklamace','Spropitné','Omluva','Záruka','Přezdívka','Spolubydlící','Výplata','Zpoždění','Fronta','Pokuta','Překvapení','Tajemství','Sázka','Pověra','Sleva','Zásilka','Kapesné','Pohovor','Záloha','Výpověď','Telefonát','Objednávka','Rezervace','Doručení','Soutěž','Prázdniny','Vstupenka','Půjčka','Rande','Nájem'],mime:['Škytavka','Zívání','Mrkání','Kulhání','Klování','Šplhání','Fotograf','Boxer','Bubeník','Kadeřník','Kominík','Potápěč','Houslista','Dirigent','Baletka','Kouzelník','Žonglér','Jízda na koni','Čištění zubů','Fénování vlasů','Vytírání podlahy','Sekání trávy','Venčení psa','Zavazování tkaniček','Loupání banánu','Mytí oken','Řízení auta','Vysávání','Žehlení','Foukání svíček']},4:{draw:['Polární záře','Ledoborec','Měsíční kráter','Observatoř','Padací most','Visutý most','Ropná plošina','Vesmírná družice','Gejzír','Katapult','Akvadukt','Zatmění Slunce','Vodní elektrárna','Ledovec','Amfiteátr','Vzducholoď','Archeologické naleziště','Meteorologická stanice','Ponorkový periskop','Potopený poklad','Tajná chodba','Černá díra','Oko hurikánu','Důlní šachta','Podzemní bunkr','Přehrada','Ledová jeskyně','Vesmírná stanice','Zvedací most','Vodní příkop'],talk:['Zkušební doba','Nouzový východ','Slepá důvěra','Inkognito','Protekce','Prodloužení smlouvy','Anonymní svědek','Podmíněný trest','Dědictví','Předplatné','Autorské právo','Amnestie','Vydědění','Domovní prohlídka','Cenzura','Patent','Embargo','Prognóza','Kauza','Konkurs','Mandát','Kompromis','Privilegium','Vedlejší účinek','Bod zlomu','Krizová situace','Diplomatická imunita','Výběrové řízení','Pojistná událost','Bankrot'],mime:['Hypnotizovat','Omdlévání','Kaskadér','Loutkář','Dražitel','Someliér','Nosič zavazadel','Ochočit si zvíře','Provazochodec','Krotitel lvů','Balancování','Přetahování lanem','Předstírat spánek','Iluzionista','Restaurátor','Kartograf','Průvodčí','Kovář','Pašerák','Zadržovat smích','Být jako na trní','Přilévat olej do ohně','Plavat proti proudu','Otevírat trezor','Hledat signál','Přelézat plot','Uklouznout na ledu','Rozmotávat kabel','Pumpovat pneumatiku','Přecházet po kládě']},5:{draw:['Schrödingerova kočka','Gordický uzel','Damoklův meč','Pandořina skříňka','Fata morgána','Babylonská věž','Möbiova páska','Červí díra','Tektonický zlom','Magnetické pole','Perpetuum mobile','Ztracená civilizace','Časová smyčka','Most mezi světy','Ztracený ráj','Dům z karet','Labyrint zrcadel','Sisyfův kámen','Newtonovo kyvadlo','Kvantový tunel','Optický klam','Nekonečné schodiště','Město pod hladinou','Stroj času','Dvojitá spirála','Kruhy v obilí','Mechanické srdce','Ostrov ve vzduchu','Obrácený vodopád','Hodiny bez ručiček'],talk:['Kognitivní disonance','Sebenaplňující proroctví','Klam přeživších','Existenciální krize','Presumpce neviny','Status quo','Precedent','Kolektivní vina','Oportunismus','Suverenita','Pyrrhovo vítězství','Morální dilema','Důkazní břemeno','Konflikt svědomí','Střet hodnot','Nechtěný důsledek','Veřejné tajemství','Dvojí metr','Efekt motýlích křídel','Osudová chyba','Právo veta','Paradox volby','Politický azyl','Kauzalita','Etický kodex','Společenská smlouva','Mocenské vakuum','Informační asymetrie','Stádní efekt','Teorie chaosu'],mime:['Přeskočit vlastní stín','Házet flintu do žita','Chodit kolem horké kaše','Tančit jak někdo píská','Dělat z komára velblouda','Chytat druhý dech','Ztratit nit','Zachovat chladnou hlavu','Chodit po špičkách','Bojovat sám se sebou','Ztratit tvář','Chytat se stébla','Házet hrách na zeď','Plavat proti proudu','Přilévat olej do ohně','Mít máslo na hlavě','Šlápnout vedle','Za pět minut dvanáct','Být jako na trní','Ztratit půdu pod nohama','Boj s větrnými mlýny','Zakázané ovoce','Kámen úrazu','Ticho před bouří','Oko hurikánu','Časovaná bomba','Konec světa','Útěk z vězení','Záchvat paniky','Mozková bouře']}};
const way=[[7,84],[18,78],[28,67],[20,55],[14,42],[20,29],[34,25],[45,34],[53,47],[48,61],[58,72],[72,76],[84,69],[79,55],[69,45],[72,31],[83,28],[92,22]];function makePath(){let pts=[];for(let i=0;i<way.length-1;i++){let a=way[i],b=way[i+1],n=i===way.length-2?4:3;for(let j=0;j<n;j++){let t=j/n;pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}pts.push(way[way.length-1]);while(pts.length>48)pts.splice(pts.length-2,1);while(pts.length<48){let i=pts.length-1,a=pts[i-1],b=pts[i];pts.splice(i,0,[(a[0]+b[0])/2,(a[1]+b[1])/2])}return pts.slice(0,48)}const PATH=makePath();
let players=[],turn=0,dice=0,target=0,guesser=null,used={},timerId=null,left=65;const diceChars=['⚀','⚁','⚂','⚃','⚄','⚅'];function names(){let n=+$('count').value;$('names').innerHTML='';['Petr','Lenka','Tomáš','Eva'].slice(0,n).forEach((v,i)=>{let x=document.createElement('input');x.className='name';x.value=v;x.placeholder='Jméno hráče '+(i+1);$('names').appendChild(x)})}
function buildBoard(){let layer=$('fieldLayer');layer.innerHTML='';PATH.forEach((p,i)=>{let k=i%6,c=document.createElement('div');c.id='f'+i;c.className='cell c'+k+(i===0?' start':'')+(i===47?' finish':'');c.style.left=p[0]+'%';c.style.top=p[1]+'%';c.innerHTML='<span class="num">'+(i+1)+'</span><span class="cellIcon">'+(i===0?'🚩':i===47?'🏆':COLORS[k][1])+'</span><div class="pieces" id="pc'+i+'"></div>';layer.appendChild(c)});let svgPts=PATH.map(p=>(p[0]*10)+','+(p[1]*6)).join(' ');$('route').setAttribute('points',svgPts);$('routeShadow').setAttribute('points',svgPts)}
function start(){players=[...document.querySelectorAll('.name')].map((x,i)=>({name:x.value.trim()||'Hráč '+(i+1),pos:0}));$('setup').classList.add('hidden');$('play').classList.remove('hidden');buildBoard();update()}
function update(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{let e=document.createElement('span');e.className='piece p'+i;e.textContent=i+1;$('pc'+p.pos).appendChild(e)});$('turn').textContent=players[turn]?.name||'';$('scores').innerHTML=players.map((p,i)=>'<span class="score">'+['🔴','🔵','🟢','🟣'][i]+' '+p.name+' · '+(p.pos+1)+'</span>').join('')}
function roll(){dice=1+Math.floor(Math.random()*6);$('die').textContent=diceChars[dice-1];target=Math.min(47,players[turn].pos+dice)%6;$('roll').disabled=true;$('diceStep').classList.add('hidden');const level=dice<=2?3:dice<=4?4:5;card(level)}
function pick(l,t){let a=P[l][t],key=l+t;if(!used[key]||used[key].length>=a.length)used[key]=[];let ix;do ix=Math.floor(Math.random()*a.length);while(used[key].includes(ix));used[key].push(ix);return a[ix]}
function card(l){clearTimer();$('rows').innerHTML='';COLORS.forEach((c,i)=>{let r=document.createElement('div');r.className='row '+c[0]+(i===target?' active':'');r.innerHTML='<div class="rowIcon">'+c[1]+'</div><div class="word"><span>'+pick(l,c[3])+'</span><span class="act">'+c[2]+'</span></div>';$('rows').appendChild(r)});$('ctitle').textContent='KARTA '+l;$('target').textContent='HRAJE SE: '+COLORS[target][2].toUpperCase();$('guessers').innerHTML='';players.forEach((p,i)=>{if(i===turn)return;let b=document.createElement('button');b.className='guess';b.textContent=p.name;b.addEventListener('click',()=>finish(true,i));$('guessers').appendChild(b)});$('cardStep').classList.remove('hidden');$('timeup').classList.add('hidden');startTimer()}
function startTimer(){left=65;drawTimer();timerId=setInterval(()=>{left--;drawTimer();if(left<=0){clearTimer();$('timeup').classList.remove('hidden')}},1000)}function drawTimer(){let t=$('timer'),m=Math.floor(left/60),s=left%60;t.textContent=m+':'+String(s).padStart(2,'0');t.classList.toggle('danger',left<=10)}function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function finish(ok,guesserIndex=null){clearTimer();if(ok){players[turn].pos=Math.min(47,players[turn].pos+dice);if(guesserIndex!==null)players[guesserIndex].pos=Math.min(47,players[guesserIndex].pos+1)}update();let w=players.find(p=>p.pos>=47);if(w){setTimeout(()=>alert('🏆 Vyhrává '+w.name+'!'),50);return}turn=(turn+1)%players.length;dice=0;$('roll').disabled=false;$('cardStep').classList.add('hidden');$('diceStep').classList.remove('hidden');update()}
$('count').addEventListener('change',names);$('start').addEventListener('click',start);$('roll').addEventListener('click',roll);$('no').addEventListener('click',()=>finish(false));$('reset').addEventListener('click',()=>{clearTimer();location.reload()});names();
</script></body></html>
