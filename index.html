:root{--y:#ffd83d;--c:#56c9ef;--p:#c55bd8;--g:#65c657;--b:#176ac2;--o:#f28a35;--ink:#172033}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(#72caf0,#dff0b9 55%,#ecd08d)}button,input,select{font:inherit}button{border:0;font-weight:900;cursor:pointer}.hidden{display:none!important}main{height:100dvh;max-width:1100px;margin:auto;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:hidden}.hero{flex:0 0 auto;text-align:center;line-height:1}.logo{font-size:clamp(28px,6vw,52px);font-weight:1000;letter-spacing:-2px;color:#ffc52f;-webkit-text-stroke:2px #0d4f96;text-shadow:0 3px 0 #07396d}.tag{font-size:10px;font-weight:900;color:#174e82;letter-spacing:1px;margin-top:3px}.panel{background:#fffdf5ef;border:2px solid #fff;border-radius:16px;padding:8px;box-shadow:0 4px 0 #714b2b33}.setup{width:min(560px,96vw);margin:auto}.names{display:grid;gap:7px;margin:8px 0}.name,select{width:100%;padding:11px;border:2px solid #d9c79d;border-radius:11px;background:#fff;font-size:16px}.primary,.roll{padding:10px 13px;border-radius:11px;background:linear-gradient(#49bd5a,#238e39);color:#fff;box-shadow:0 3px 0 #176b2a}.gameShell{min-height:0;flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}.top{display:flex;gap:7px;align-items:center;justify-content:space-between;min-height:42px}.turnbox{background:#fff2bc;border-radius:11px;padding:5px 8px}.turn{font-size:16px;font-weight:1000}.muted{opacity:.62;font-size:11px}.scores{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.score{background:white;border:1px solid #ead9b2;border-radius:10px;padding:4px 6px;font-size:10px;font-weight:900}.smallbtn{background:#765033;color:white;padding:7px 9px;border-radius:9px;font-size:11px}.boardPanel{min-height:0;padding:5px}.boardWrap{height:100%;min-height:0;position:relative;overflow:hidden;background:linear-gradient(#bfeaff 0 28% </style></head><body><main><div class="hero"><div class="logo">AKTIVITY</div><div class="tag">ZÁBAVA, KTERÁ SPOJUJE</div></div><section id="setup" class="panel setup"><h2>🎲 Nová hra</h2><label>Počet hráčů<select id="count"><option value="3">3 hráči</option><option value="4">4 hráči</option></select></label><div id="names" class="names"></div><button id="start" class="primary" style="width:100%">ZAČÍT DOBRODRUŽSTVÍ</button></section><section id="game" class="gameShell hidden"><div class="panel top"><div class="turnbox"><div class="muted">👑 Na tahu</div><div id="turn" class="turn"></div></div><div id="scores" class="scores"></div><button id="reset" class="smallbtn">Nová hra</button></div><div class="panel boardPanel"><div class="boardWrap"><div class="scene"><span class="m1">🏔️🌲</span><span class="m2">🏰</span><span class="m3">🌊⛵</span><span class="m4">🏜️🌴</span><span class="m5">🌉</span></div><div class="startSign">START</div><div class="finishSign">🏆 CÍL</div><div id="board" class="board"></div></div></div><div class="panel playPanel"><div id="diceStep" class="dicebox"><div><b>1. Hoď kostkou</b><div class="muted">Při úspěchu se posuneš o hozený počet polí.</div></div><div style="display:flex;align-items:center;gap:6px"><div id="die" class="die">⚀</div><button id="roll" class="roll">HODIT</button></div></div><div id="levels" class="hidden"><b>2. Vyber obtížnost</b><div class="muted">Výběrem se spustí 60 sekund.</div><div class="levels"><button class="level" data-level="3">3</button><button class="level" data-level="4">4</button><button class="level" data-level="5">5</button></div></div><div id="cardStep" class="hidden"><div class="card"><div class="head"><span id="ctitle"></span><span id="target"></span><span id="timer" class="timer">1:00</span></div><div id="rows"></div></div><div id="timeup" class="timeup hidden">⏰ ČAS VYPRŠEL!</div><div class="answerRow"><div id="guessers" class="guessers"></div><div class="result"><button id="ok" class="ok">✓ UHODNUTO</button><butt let players=[],turn=0,dice=0,target=0,guesser=null,used={},timerId=null,left=60;const diceChars=['⚀','⚁','⚂','⚃','⚄','⚅'];function names(){let n=+$('count').value;$('names').innerHTML='';for(let i=0;i<n;i++){let x=document.createElement('input');x.className='name';x.placeholder='Jméno hráče '+(i+1);x.value=['Petr','Lenka','Tomáš','Eva'][i];$('names').appendChild(x)}}function start(){players=[...document.querySelectorAll('.name')].map((x,i)=>({name:x.value.trim()||'Hráč '+(i+1),pos:0}));$('setup').classList.add('hidden');$('game').classList.remove('hidden');build();update()}function build(){let b=$('board');b.innerHTML='';for(let i=0;i<48;i++){let c=document.createElement('div'),k=i%6;c.className='cell c'+k;c.innerHTML='<span class="num">'+(i+1)+'</span><span class="ico">'+COLORS[k][1]+'</span><div class="pieces" id="pc'+i+'"></div>';b.appendChild(c)}}function update(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{let e=document.createElement('span');e.className='piece p'+i;e.textContent=i+1;$('pc'+p.pos).appendChild(e)});$('turn').textContent=players[turn]?.name||'';$('scores').innerHTML=players.map((p,i)=>'<span class="score">'+['🔴','🔵','🟢','🟣'][i]+' '+p.name+' · '+p.pos+'</span>').join('')}function roll(){dice=1+Math.floor(Math.random()*6);$('die').textContent=diceChars[dice-1];target=(players[turn].pos+dice)%6;$('roll').disabled=true;$('diceStep').classList.add('hidden');$('levels').classList.remove('hidden')}function pick(l,t){let a=P[l][t],key=l+t;if(!used[key]||used[key].length>=a.length)used[key]=[];let ix;do ix=Math.floor(Math.random()*a.length);while(used[key].includes(ix));used[key].push(ix);return a[ix]}function card(l){clearTimer();$('rows').innerHTML='';COLORS.forEach((c,i)=>{let r=document.createElement('div');r.className='row '+c[0]+(i===target?' active':'');r.innerHTML='<div class="rowIcon">'+c[1]+'</div><div class="word"><span>'+pick(l,c[3])+'</span><span class="act">'+c[2]+'</span></div>';$('rows').appendChild(r)});$('ctitle').textContent='KARTA '+l;$('target').textContent='HRAJE SE: '+COLORS[target][2].toUpperCase();guesser=null;$('guessers').innerHTML='';players.forEach((p,i)=>{if(i===turn)return;let b=document.createElement('button');b.className='guess';b.textContent=p.name;b.addEventListener('click',()=>{guesser=i;document.querySelectorAll('.guess').forEach(x=>x.classList.remove('on'));b.classList.add('on')});$('guessers').appendChild(b)});$('levels').classList.add('hidden');$('cardStep').classList.remove('hidden');$('timeup').classList.add('hidden');startTimer()}function startTimer(){left=60;drawTimer();timerId=setInterval(()=>{left--;drawTimer();if(left<=0){clearTimer();$('timeup').classList.remove('hidden')}},1000)}function drawTimer(){let t=$('timer');t.textContent='0:'+String(left).padStart(2,'0');t.classList.toggle('danger',left<=10)}function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}function finish(ok){clearTimer();if(ok){players[turn].pos=Math.min(47,players[turn].pos+dice);if(guesser!==null)players[guesser].pos=Math.min(47,players[guesser].pos+1)}update();let w=players.find(p=>p.pos>=47);if(w){setTimeout(()=>alert('🏆 Vyhrává '+w.name+'!'),50);return}turn=(turn+1)%players.length;dice=0;guesser=null;$('roll').disabled=false;$('cardStep').classList.add('hidden');$('levels').classList.add('hidden');$('diceStep').classList.remove('hidden');update()}$('count').addEventListener('change',names);$('start').addEventListener('click',start);$('roll').addEventListener('click',roll);document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>card(+b.dataset.level)));$('ok').addEventListener('click',()=>finish(true));$('no').addEventListener('click',()=>finish(false));$('reset').addEventListener('click',()=>{clearTimer();location.reload()});names();
