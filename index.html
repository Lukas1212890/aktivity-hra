const X=[7,19,31,43,55,67,79,91],Y=[84,70,56,42,28,14],W=[0,-2,1,2,-1,2,-2,0];function makePath(){let pts=[];for(let r=0;r<6;r++){let xs=r%2===0?X:[...X].reverse();for(let c=0;c<8;c++){let wig=(r%2===0?W[c]:W[7-c]);pts.push([xs[c],Y[r]+wig])}}return pts}const PATH=makePath();const diceChars=['⚀','⚁','⚂','⚃','⚄','⚅'];let players=[],turn=0,dice=0,target=0,used={},timerId=null,left=65,rollTimer=null,audioCtx=null,soundEnabled=false,wakeLock=null,gameActive=false,roundSeconds=65,specials={},extraTurn=false,nextRoundTime=null,resolving=false,teamMode=false;
const SPECIAL_TYPES=[{type:'treasure',icon:'🎁',title:'POKLAD!',text:'Našel jsi zkratku. Posouváš se o 2 pole dopředu.',move:2},{type:'trap',icon:'🕳️',title:'PAST!',text:'Propadl ses do pasti. Vracíš se o 2 pole zpět.',move:-2},{type:'boost',icon:'⚡',title:'TURBO!',text:'Vítr do zad! Posouváš se o 3 pole dopředu.',move:3},{type:'again',icon:'🔁',title:'JEŠTĚ JEDNOU!',text:'Máš štěstí. Po skončení akce hraješ znovu.',again:true},{type:'panic',icon:'⏱️',title:'PANIKA!',text:'Příští kolo bude mít jen 45 sekund.',time:45}];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function requestWakeLock(){if(!gameActive||document.visibilityState!=='visible'||!('wakeLock'in navigator)){updateWakeState();return}try{if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;updateWakeState()})}}catch(e){wakeLock=null}updateWakeState()}
async function releaseWakeLock(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}updateWakeState()}
function updateWakeState(){if(!$('wakeState'))return;if(!('wakeLock'in navigator)){$('wakeState').textContent='nepodporováno';$('wakeState').className='wakeNo'}else if(wakeLock){$('wakeState').textContent='aktivní';$('wakeState').className='wakeOk'}else{$('wakeState').textContent='neaktivní';$('wakeState').className='wakeNo'}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&gameActive)requestWakeLock()});
async function enableAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC){$('sound').textContent='🔇 Nepodporováno';$('sound').disabled=true;return false}if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')await audioCtx.resume();soundEnabled=true;$('sound').textContent='🔊 Zvuk zapnutý';$('sound').classList.add('soundOn');tone(740,.08,.09);setTimeout(()=>tone(980,.10,.10),100);return true}catch(e){return false}}
function disableAudio(){soundEnabled=false;$('sound').textContent='🔇 Zapnout zvuk';$('sound').classList.remove('soundOn')}
function tone(freq,duration,volume=.08,delay=0,type='sine',endFreq=null){if(!soundEnabled||!audioCtx||audioCtx.state!=='running')return;const now=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration+.03)}
function warningBeep(){tone(880,.11,.10)}function endSound(){tone(330,.7,.13,0,'square',110);tone(220,.85,.09,.04,'sawtooth',82);tone(660,.12,.07);tone(440,.16,.08,.16)}function diceRattle(){for(let i=0;i<6;i++)tone(120+Math.random()*140,.045,.035,i*.09,'square')}function diceLand(){tone(170,.08,.09,0,'triangle');tone(100,.11,.06,.05,'sine')}function stepSound(){tone(520,.045,.035,0,'sine')}function successSound(){tone(660,.08,.08);tone(880,.11,.09,.09);tone(1100,.13,.09,.2)}function failSound(){tone(220,.12,.07);tone(150,.25,.08,.12,'sawtooth')}function specialSound(){tone(520,.08,.08);tone(780,.1,.09,.09);tone(1040,.14,.1,.2)}
function setupGameMode(){let box=document.createElement('div');box.id='modeBlock';box.innerHTML='<label>Herní režim<select id="mode"><option value="ffa">Všichni proti všem</option><option value="teams">Dva proti dvěma</option></select></label><div id="teamHint" class="teamHint hidden">Tým 1: hráči 1 a 2 · Tým 2: hráči 3 a 4</div>';$('names').before(box);$('mode').addEventListener('change',names);let s=document.createElement('style');s.textContent='.teamHint{margin-top:6px;padding:7px 9px;border-radius:9px;background:#e8f3ff;color:#173d64;font-size:12px;font-weight:800}';document.head.appendChild(s);updateModeChooser()}
function updateModeChooser(){let four=+$('count').value===4;$('modeBlock').classList.toggle('hidden',!four);if(!four)$('mode').value='ffa'}
function names(){let n=+$('count').value,isTeams=n===4&&$('mode')?.value==='teams';$('names').innerHTML='';for(let i=0;i<n;i++){let x=document.createElement('input');x.className='name';x.placeholder=isTeams?'Hráč '+(i+1)+' – tým '+(i<2?1:2):'Jméno hráče '+(i+1);$('names').appendChild(x)}$('teamHint')?.classList.toggle('hidden',!isTeams)}
function randomizeSpecials(){specials={};let positions=[];while(positions.length<SPECIAL_TYPES.length){let p=4+Math.floor(Math.random()*40);if(!positions.includes(p))positions.push(p)}positions.forEach((p,i)=>specials[p]={...SPECIAL_TYPES[i],revealed:false,used:false})}
function buildBoard(){let layer=$('fieldLayer');layer.innerHTML='';PATH.forEach((p,i)=>{let k=i%6,c=document.createElement('div');c.id='f'+i;c.className='cell c'+k+(i===0?' start':'')+(i===47?' finish':'');c.style.left=p[0]+'%';c.style.top=p[1]+'%';c.innerHTML='<span class="num">'+(i+1)+'</span><span class="cellIcon" id="icon'+i+'">'+(i===0?'🚩':i===47?'🏆':COLORS[k][1])+'</span><div class="pieces" id="pc'+i+'"></div>';layer.appendChild(c)});let svgPts=PATH.map(p=>(p[0]*10)+','+(p[1]*6)).join(' ');$('route').setAttribute('points',svgPts);$('routeShadow').setAttribute('points',svgPts)}
function start(){gameActive=true;randomizeSpecials();let entered=[...document.querySelectorAll('.name')].map((x,i)=>x.value.trim()||'Hráč '+(i+1));teamMode=entered.length===4&&$('mode').value==='teams';players=teamMode?[{name:'Tým 1',members:entered.slice(0,2),role:0,pos:0,opening:true},{name:'Tým 2',members:entered.slice(2,4),role:0,pos:0,opening:true}]:entered.map(name=>({name,pos:0,opening:true}));$('setup').classList.add('hidden');$('play').classList.remove('hidden');buildBoard();update();requestWakeLock()}
function update(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{let e=document.createElement('span');e.className='piece p'+i;e.id='piece'+i;e.textContent=i+1;$('pc'+p.pos).appendChild(e)});let p=players[turn];$('turn').textContent=p?(teamMode?p.name+' · '+p.members[p.role]+' hraje':p.name):'';$('scores').innerHTML=players.map((p,i)=>'<span class="score">'+['🔴','🔵','🟢','🟣'][i]+' '+p.name+(teamMode?' ('+p.members.join(' + ')+')':'')+' · '+(p.pos+1)+'/48</span>').join('')}
function roll(){if($('roll').disabled||resolving)return;requestWakeLock();diceRattle();$('roll').disabled=true;const d=$('die');d.classList.remove('rolling');void d.offsetWidth;d.classList.add('rolling');let flips=0;const flick=setInterval(()=>{d.textContent=diceChars[Math.floor(Math.random()*6)];if(++flips>=7)clearInterval(flick)},85);dice=1+Math.floor(Math.random()*6);setTimeout(()=>{clearInterval(flick);d.textContent=diceChars[dice-1];d.classList.remove('rolling');diceLand();target=players[turn].opening?-1:players[turn].pos%6;const level=dice<=2?3:dice<=4?4:5;rollTimer=setTimeout(()=>{rollTimer=null;$('diceStep').classList.add('hidden');card(level)},1000)},700)}
function pick(l,t){let a=P[l][t],key=l+t;if(!used[key]||used[key].length>=a.length)used[key]=[];let ix;do ix=Math.floor(Math.random()*a.length);while(used[key].includes(ix));used[key].push(ix);return a[ix]}
function setupCardPrivacy(){let b=document.createElement('button');b.id='hideCard';b.className='hideCard';b.textContent='🙈 SKRÝT';$('timer').before(b);b.addEventListener('click',e=>{e.stopPropagation();$('cardStep').classList.add('concealed')});$('cardStep').addEventListener('click',()=>{if($('cardStep').classList.contains('concealed'))$('cardStep').classList.remove('concealed')});let s=document.createElement('style');s.textContent='.hideCard{background:#68432d;color:#fff;border:2px solid #ffffff66;border-radius:9px;padding:7px 10px;font-size:12px;white-space:nowrap}.cardOverlay.concealed{background:#10253ef7;cursor:pointer}.cardOverlay.concealed .cardWrap{width:auto;max-height:none;background:none;border:0;padding:0;box-shadow:none;animation:none}.cardOverlay.concealed .card{background:none;border:0;overflow:visible}.cardOverlay.concealed .head{background:none;padding:0}.cardOverlay.concealed .head>*:not(.timer),.cardOverlay.concealed .rows,.cardOverlay.concealed .timeup,.cardOverlay.concealed .answerRow{display:none!important}.cardOverlay.concealed .timer{font-size:clamp(58px,18vw,140px);padding:14px 24px;pointer-events:none;box-shadow:0 8px 30px #0006}';document.head.appendChild(s)}
function card(l){clearTimer();$('cardStep').classList.remove('concealed');$('rows').innerHTML='';COLORS.forEach((c,i)=>{let r=document.createElement('div');r.className='row '+c[0]+(i===target?' active':'');r.innerHTML='<div class="rowIcon">'+c[1]+'</div><div class="word"><span>'+pick(l,c[3])+'</span><span class="act">'+c[2]+'</span></div>';$('rows').appendChild(r)});let p=players[turn];$('ctitle').textContent=teamMode?p.members[p.role]+' → '+p.members[1-p.role]:'KARTA '+l;$('target').textContent=target<0?'VYBER SI LIBOVOLNÉ SLOVO':'HRAJE SE: '+COLORS[target][2].toUpperCase();$('guessers').innerHTML='';if(teamMode){let b=document.createElement('button');b.className='guess';b.textContent='✓ UHODLI';b.addEventListener('click',()=>finish(true));$('guessers').appendChild(b)}else players.forEach((p,i)=>{if(i===turn)return;let b=document.createElement('button');b.className='guess';b.textContent='✓ '+p.name;b.addEventListener('click',()=>finish(true,i));$('guessers').appendChild(b)});$('cardStep').classList.remove('hidden');$('timeup').classList.add('hidden');startTimer()}
function startTimer(){left=nextRoundTime||roundSeconds;nextRoundTime=null;drawTimer();timerId=setInterval(()=>{left--;drawTimer();if(left>0&&left<=3)warningBeep();if(left<=0){clearTimer();endSound();$('timeup').classList.remove('hidden')}},1000)}
function drawTimer(){let t=$('timer'),m=Math.floor(left/60),s=left%60;t.textContent=m+':'+String(s).padStart(2,'0');t.classList.toggle('danger',left<=10);$('cardWrap').classList.toggle('tense',left<=10&&left>0)}function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}$('cardWrap').classList.remove('tense')}
function flash(ok){let f=document.createElement('div');f.className='resultFlash '+(ok?'ok':'bad');f.textContent=ok?'✓ SUPER!':'✕ NEUHODNUTO';$('mapPanel').appendChild(f);setTimeout(()=>f.remove(),750)}
function confetti(count=30){const box=$('confetti'),cols=['#ffcf33','#ed4f5f','#4bc0ff','#67c45e','#b76ae0','#ff8c3a'];for(let i=0;i<count;i++){let c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];c.style.animationDelay=Math.random()*.45+'s';c.style.animationDuration=(1.7+Math.random()*1.4)+'s';box.appendChild(c);setTimeout(()=>c.remove(),3300)}}
async function animateMove(playerIndex,delta){let steps=Math.abs(delta),dir=Math.sign(delta);for(let i=0;i<steps;i++){let old=players[playerIndex].pos,neu=Math.max(0,Math.min(47,old+dir));if(neu===old)break;players[playerIndex].pos=neu;update();let piece=$('piece'+playerIndex);if(piece){piece.classList.add('hop');setTimeout(()=>piece.classList.remove('hop'),340)}stepSound();await sleep(320)}}
function revealSpecial(pos,s){s.revealed=true;s.used=true;let cell=$('f'+pos),icon=$('icon'+pos);if(cell){cell.classList.add('specialRevealed');icon.textContent=s.icon}}
async function showSpecial(s){specialSound();$('eventIcon').textContent=s.icon;$('eventTitle').textContent=s.title;$('eventText').textContent=s.text;$('eventOverlay').classList.remove('hidden');return new Promise(resolve=>{$('eventBtn').onclick=()=>{$('eventOverlay').classList.add('hidden');resolve()}})}
async function triggerSpecial(playerIndex){let pos=players[playerIndex].pos,s=specials[pos];if(!s||s.used)return;revealSpecial(pos,s);if(s.move)await animateMove(playerIndex,s.move);if(s.again)extraTurn=true;if(s.time)nextRoundTime=s.time;await showSpecial(s)}
async function finish(ok,guesserIndex=null){if(resolving)return;resolving=true;players[turn].opening=false;clearTimer();flash(ok);ok?successSound():failSound();if(ok)confetti(14);await sleep(650);$('cardStep').classList.add('hidden');if(ok){await animateMove(turn,dice);if(!teamMode&&guesserIndex!==null)await animateMove(guesserIndex,1);if(await checkWinner()){resolving=false;return}await triggerSpecial(turn);if(await checkWinner()){resolving=false;return}}dice=0;$('roll').disabled=false;$('diceStep').classList.remove('hidden');if(teamMode)players[turn].role=1-players[turn].role;if(!extraTurn)turn=(turn+1)%players.length;else extraTurn=false;update();resolving=false}
async function checkWinner(){let wi=players.findIndex(p=>p.pos>=47);if(wi<0)return false;clearTimer();let p=players[wi];$('victoryName').textContent='🏅 '+p.name+(teamMode?' ('+p.members.join(' + ')+')':'')+' dorazil do cíle!';$('victoryOverlay').classList.remove('hidden');confetti(80);successSound();setTimeout(()=>successSound(),350);return true}
$('count').addEventListener('change',()=>{updateModeChooser();names()});$('start').addEventListener('click',start);$('roll').addEventListener('click',roll);$('no').addEventListener('click',()=>finish(false));$('menu').addEventListener('click',()=>{$('menuOverlay').classList.remove('hidden');updateWakeState()});$('menuClose').addEventListener('click',()=>$('menuOverlay').classList.add('hidden'));$('sound').addEventListener('click',async()=>{if(soundEnabled)disableAudio();else await enableAudio()});$('roundTime').addEventListener('change',()=>roundSeconds=+$('roundTime').value);$('victoryBtn').addEventListener('click',()=>location.reload());$('reset').addEventListener('click',async()=>{gameActive=false;await releaseWakeLock();clearTimer();if(rollTimer)clearTimeout(rollTimer);if(audioCtx){try{audioCtx.close()}catch(e){}}location.reload()});window.addEventListener('pagehide',()=>{gameActive=false;releaseWakeLock()});setupGameMode();setupCardPrivacy();names();updateWakeState();
