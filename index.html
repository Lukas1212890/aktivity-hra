function warningBeep(){tone(880,.11,.10,0,'sine')}
function endSound(){tone(330,.7,.13,0,'square',110);tone(220,.85,.09,.04,'sawtooth',82);tone(660,.12,.07,0,'sine');tone(440,.16,.08,.16,'sine')}
function names(){let n=+$('count').value;$('names').innerHTML='';for(let i=0;i<n;i++){let x=document.createElement('input');x.className='name';x.value='';x.placeholder='Jméno hráče '+(i+1);$('names').appendChild(x)}}function buildBoard(){let layer=$('fieldLayer');layer.innerHTML='';PATH.forEach((p,i)=>{let k=i%6,c=document.createElement('div');c.id='f'+i;c.className='cell c'+k+(i===0?' start':'')+(i===47?' finish':'');c.style.left=p[0]+'%';c.style.top=p[1]+'%';c.innerHTML='<span class="num">'+(i+1)+'</span><span class="cellIcon">'+(i===0?'🚩':i===47?'🏆':COLORS[k][1])+'</span><div class="pieces" id="pc'+i+'"></div>';layer.appendChild(c)});let svgPts=PATH.map(p=>(p[0]*10)+','+(p[1]*6)).join(' ');$('route').setAttribute('points',svgPts);$('routeShadow').setAttribute('points',svgPts)}function start(){players=[...document.querySelectorAll('.name')].map((x,i)=>({name:x.value.trim()||'Hráč '+(i+1),pos:0}));$('setup').classList.add('hidden');$('play').classList.remove('hidden');buildBoard();update()}function update(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{let e=document.createElement('span');e.className='piece p'+i;e.textContent=i+1;$('pc'+p.pos).appendChild(e)});$('turn').textContent=players[turn]?.name||'';$('scores').innerHTML=players.map((p,i)=>'<span class="score">'+['🔴','🔵','🟢','🟣'][i]+' '+p.name+' · '+(p.pos+1)+'</span>').join('')}function roll(){if($('roll').disabled)return;$('roll').disabled=true;const d=$('die');d.classList.remove('rolling');void d.offsetWidth;d.classList.add('rolling');let flips=0;const flick=setInterval(()=>{d.textContent=diceChars[Math.floor(Math.random()*6)];if(++flips>=7)clearInterval(flick)},85);dice=1+Math.floor(Math.random()*6);setTimeout(()=>{clearInterval(flick);d.textContent=diceChars[dice-1];d.classList.remove('rolling');target=Math.min(47,players[turn].pos+dice)%6;const level=dice<=2?3:dice<=4?4:5;rollTimer=setTimeout(()=>{rollTimer=null;$('diceStep').classList.add('hidden');card(level)},1000)},700)}function pick(l,t){let a=P[l][t],key=l+t;if(!used[key]||used[key].length>=a.length)used[key]=[];let ix;do ix=Math.floor(Math.random()*a.length);while(used[key].includes(ix));used[key].push(ix);return a[ix]}function card(l){clearTimer();$('rows').innerHTML='';COLORS.forEach((c,i)=>{let r=document.createElement('div');r.className='row '+c[0]+(i===target?' active':'');r.innerHTML='<div class="rowIcon">'+c[1]+'</div><div class="word"><span>'+pick(l,c[3])+'</span><span class="act">'+c[2]+'</span></div>';$('rows').appendChild(r)});$('ctitle').textContent='KARTA '+l;$('target').textContent='HRAJE SE: '+COLORS[target][2].toUpperCase();$('guessers').innerHTML='';players.forEach((p,i)=>{if(i===turn)return;let b=document.createElement('button');b.className='guess';b.textContent='✓ '+p.name;b.addEventListener('click',()=>finish(true,i));$('guessers').appendChild(b)});$('cardStep').classList.remove('hidden');$('timeup').classList.add('hidden');startTimer()}function startTimer(){left=65;drawTimer();timerId=setInterval(()=>{left--;drawTimer();if(left>0&&left<=3)warningBeep();if(left<=0){clearTimer();endSound();$('timeup').classList.remove('hidden')}},1000)}function drawTimer(){let t=$('timer'),m=Math.floor(left/60),s=left%60;t.textContent=m+':'+String(s).padStart(2,'0');t.classList.toggle('danger',left<=10)}function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}function finish(ok,guesserIndex=null){clearTimer();if(ok){players[turn].pos=Math.min(47,players[turn].pos+dice);if(guesserIndex!==null)players[guesserIndex].pos=Math.min(47,players[guesserIndex].pos+1)}update();let w=players.find(p=>p.pos>=47);if(w){setTimeout(()=>alert('🏆 Vyhrává '+w.name+'!'),50);return}turn=(turn+1)%players.length;dice=0;$('roll').disabled=false;$('cardStep').classList.add('hidden');$('diceStep').classList.remove('hidden');update()}$('count').addEventListener('change',names);$('start').addEventListener('click',start);$('roll').addEventListener('click',roll);$('no').addEventListener('click',()=>finish(false));$('sound').addEventListener('click',async()=>{if(soundEnabled)disableAudio();else await enableAudio()});$('reset').addEventListener('click',()=>{clearTimer();if(rollTimer)clearTimeout(rollTimer);if(audioCtx){try{audioCtx.close()}catch(e){}}location.reload()});names();
</script></body></html>
