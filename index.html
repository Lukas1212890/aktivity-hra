<!doctype html>
<html lang="cs">
<head>

<title>Aktivity</title>
<style>
:root{--y:#f2d34b;--c:#69cbea;--p:#d76aa7;--g:#77b965;--b:#3376b6;--o:#ed9137;--bg:#e9dfca;--ink:#202329}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1000px;margin:auto;padding:12px}.panel{background:#fff;border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 10px 28px #0002}h1{margin:0 0 8px;font-size:42px}.muted{opacity:.62}button,input,select{font:inherit}button{border:0;font-weight:900;cursor:pointer}.primary,.roll{background:#20242a;color:#fff;border-radius:14px;padding:14px 18px}.hidden{display:none!important}.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.name{width:100%;padding:13px;border:2px solid #ddd;border-radius:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.turn{font-size:23px;font-weight:950}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{padding:7px 10px;background:#f4f4f4;border-radius:11px;font-weight:800}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;background:#faf4e7;padding:7px;border-radius:18px}.cell{min-height:66px;border-radius:11px;padding:4px;font-weight:900;box-shadow:inset 0 -3px #0001}.c0{background:var(--y)}.c1{background:var(--c)}.c2{background:var(--p)}.c3{background:var(--g)}.c4{background:var(--b);color:#fff}.c5{background:var(--o)}.n{font-size:10px;opacity:.5}.pieces{min-height:38px;display:flex;gap:2px;flex-wrap:wrap;align-items:center;justify-content:center}.piece{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0005;color:#fff;display:grid;place-items:center;font-size:11px}.p0{background:#111}.p1{background:#b62929}.p2{background:#7048aa}.p3{background:#16815f}.dicebox{display:flex;justify-content:space-between;align-items:center;gap:12px}.die{font-size:60px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.level{padding:17px;border-radius:15px;background:#25282d;color:#fff;font-size:24px}.card{border:1px solid #ddd;border-radius:18px;overflow:hidden}.head{background:#20242a;color:#fff;padding:12px;display:flex;justify-content:space-between;font-weight:900}.row{display:grid;grid-template-columns:52px 1fr;min-height:59px;border-bottom:1px solid #0001}.ico{display:grid;place-items:center;font-size:24px}.word{padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:850}.act{font-size:11px;opacity:.55}.active{outline:5px solid #111;outline-offset:-5px}.guessers{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.guess{padding:9px 12px;border-radius:11px;background:#eee}.guess.on{background:#222;color:#fff}.ok,.no{width:100%;padding:14px;border-radius:13px;color:#fff;margin-top:7px}.ok{background:#2e8556}.no{background:#a43d3d}@media(max-width:650px){main{padding:8px}.panel{padding:12px;border-radius:17px}.names{grid-template-columns:1fr}.board{grid-template-columns:repeat(6,1fr)}.cell{min-height:54px}.word{font-size:14px}.scores{font-size:12px}h1{font-size:35px}}

<body><main>
<section id="setup" class="panel"><h1>AKTIVITY 🎲</h1><p>Vyber počet hráčů a napiš jména.</p><label>Počet hráčů <select id="count"><option value="3">3</option><option value="4">4</option></select></label><div id="names" class="names"></div><button id="start" class="primary">ZAČÍT HRU</button></section>
<section id="game" class="hidden"><div class="panel top"><div><div class="muted">Na tahu</div><div id="turn" class="turn"></div></div><div id="scores" class="scores"></div><button id="reset" class="primary">Nová hra</button></div><div class="panel"><div id="board" class="board"></div></div><div class="panel"><div id="diceStep" class="dicebox"><div><b>1. Hoď kostkou</b><div class="muted">Při úspěchu se posuneš o hozený počet polí.</div></div><div><div id="die" class="die">⚀</div><button id="roll" class="roll">HODIT</button></div></div><div id="levels" class="hidden"><b>2. Vyber obtížnost</b><div class="muted">3 lehká • 4 střední • 5 těžká</div><div class="levels"><button class="level" data-level="3">3</button><button class="level" data-level="4">4</button><button class="level" data-level="5">5</button></div></div><div id="cardStep" class="hidden"><div class="card"><div class="head"><span id="ctitle"></span><span id="target"></span></div><div id="rows"></div></div><p><b>Kdo pojem uhodl?</b> <span class="muted">Uhádnuvší hráč jde +1.</span></p><div id="guessers" class="guessers"></div><button id="ok" class="ok">✓ UHODNUTO</button><button id="no" class="no">✕ NEUHODNUTO</button></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const COLORS=[['c0','🎨','Kreslení','draw'],['c1','🗣️','Mluvení','talk'],['c2','🎭','Pantomima','mime'],['c3','🎨','Kreslení','draw'],['c4','🗣️','Mluvení','talk'],['c5','🎭','Pantomima','mime']];
const POOLS={3:{draw:['Kompas','Vrtulník','Skleník','Vodopád','Traktor','Ponorka','Akvárium','Kolotoč','Lanovka','Rozhledna','Pirátská loď','Horkovzdušný balón','Psí bouda','Kukačkové hodiny','Ptačí budka','Větrný mlýn','Pavučina','Semafor','Dalekohled','Sněhulák','Slunečnice','Vesmírná raketa','Zámek','Kurník','Přístav','Lunapark','Plachetnice','Knihovna','Stromový domek','Pískoviště','Stodola','Kostelní věž','Nákupní vozík','Autobusová zastávka','Kávovar','Kytara','Fotoaparát','Žebřík','Padák','Saně'],talk:['Reklamace','Spropitné','Omluva','Záruka','Přezdívka','Spolubydlící','Výplata','Zpoždění','Fronta','Pokuta','Překvapení','Tajemství','Sázka','Pověra','Sleva','Zásilka','Kapesné','Pohovor','Záloha','Výpověď','Dlužník','Svědek','Úplatek','Telefonát','Objednávka','Rezervace','Doručení','Soutěž','Prázdniny','Domácí úkol','Vysvědčení','Jízdní řád','Vstupenka','Předpověď počasí','Půjčka','Rande','Přestup','Výhra','Prohra','Nájem'],mime:['Škytavka','Zívání','Mrkání','Kulhání','Klování','Šplhání','Fotograf','Boxer','Bubeník','Kadeřník','Kominík','Potápěč','Houslista','Dirigent','Baletka','Plavčík','Zedník','Kouzelník','Žonglér','Jízda na koni','Čištění zubů','Fénování vlasů','Vytírání podlahy','Sekání trávy','Venčení psa','Zavazování tkaniček','Loupání banánu','Mytí oken','Řízení auta','Skákání přes švihadlo','Psaní na klávesnici','Vysávání','Žehlení','Krmení slepic','Dojení krávy','Sázení stromu','Zamykání dveří','Hledání klíčů','Pití horkého čaje','Foukání svíček']},4:{draw:['Polární záře','Ledoborec','Měsíční kráter','Observatoř','Padací most','Visutý most','Ropná plošina','Vesmírná družice','Gejzír','Katapult','Akvadukt','Zatmění Slunce','Vodní elektrárna','Ledovec','Amfiteátr','Vzducholoď','Archeologické naleziště','Meteorologická stanice','Ponorkový periskop','Potopený poklad','Tajná chodba','Černá díra','Časovaná bomba','Oko hurikánu','Bermudský trojúhelník','Město duchů','Dům vzhůru nohama','Důlní šachta','Závodní okruh','Vodní mlýn','Solární elektrárna','Podze Mapa bez hranic','Prasklina v časoprostoru','Ostrov ve vzduchu','Obrácený vodopád','Skleněný labyrint','Hodiny bez ručiček','Rozbitý kompas'],talk:['Kognitivní disonance','Sebenaplňující proroctví','Klam přeživších','Existenciální krize','Presumpce neviny','Status quo','Precedent','Deregulace','Kolektivní vina','Střet jurisdikcí','Oportunismus','Suverenita','Pyrrhovo vítězství','Morální dilema','Důkazní břemeno','Konflikt svědomí','Střet hodnot','Nechtěný důsledek','Veřejné tajemství','Dvojí metr','Efekt motýlích křídel','Osudová chyba','Teorie relativity','Právo veta','Paradox volby','Kulturní dědictví','Diplomatická roztržka','Politický azyl','Princip reciprocity','Kauzalita','Objektivní odpovědnost','Nepřímý důkaz','Etický kodex','Společenská smlouva','Mocenské vakuum','Informační embargo','Přirozený monopol','Legitimita','Arbitráž','Konformita'],mime:['Morální kocovina','Vystřízlivění z iluzí','Bojovat sám se sebou','Ztratit tvář','Překročit Rubikon','Chodit po laně poslepu','Vytáhnout trumf z rukávu','Pálit mosty','Vzít nohy na ramena','Zachovat chladnou hlavu','Tančit, jak někdo píská','Házet flintu do žita','Chodit kolem horké kaše','Dělat z komára velblouda','Přijít s křížkem po funuse','Sedět na dvou židlích','Mít svázané ruce','Dostat studenou sprchu','Nosit dříví do lesa','Jít hlavou proti zdi','Držet jazyk za zuby','Mít oči na stopkách','Vylézt z ulity','Zamést něco pod koberec','Chytit vítr do plachet','Dívat se skrz prsty','Mít hlavu v oblacích','Být páté kolo u vozu','Utahovat si opasek','Nést kůži na trh','Píchnout do vosího hnízda','Mít nůž na krku','Sypat si popel na hlavu','Být mezi dvěma ohni','Dostat se z bláta do louže','Krýt si záda','Otevřít někomu oči','Přehodit výhybku','Hodit někomu záchranné lano','Zůstat stát jako solný sloup']}};
let players=[],turn=0,dice=0,targetColor=0,guesser=null;const used={3:{draw:[],talk:[],mime:[]},4:{draw:[],talk:[],mime:[]},5:{draw:[],talk:[],mime:[]}};
function names(){const n=+$('count').value;$('names').innerHTML='';for(let i=0;i<n;i++){const x=document.createElement('input');x.className='name';x.id='n'+i;x.value='Hráč '+(i+1);x.placeholder='Jméno hráče '+(i+1);$('names').appendChild(x)}}
function start(){players=[];for(let i=0;i<+$('count').value;i++)players.push({name:$('n'+i).value.trim()||'Hráč '+(i+1),pos:0});$('setup').classList.add('hidden');$('game').classList.remove('hidden');board();update()}
function board(){$('board').innerHTML='';for(let i=0;i<48;i++){const x=document.createElement('div');x.className='cell c'+(i%6);x.id='cell'+i;x.innerHTML='<div class="n">'+(i===0?'START':i===47?'CÍL':i+1)+'</div><div class="pieces"></div>';$('board').appendChild(x)}pieces()}
function pieces(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{const h=document.querySelector('#cell'+Math.min(p.pos,47)+' .pieces');const s=document.createElement('span');s.className='piece p'+i;s.textContent=(p.name[0]||'?').toUpperCase();h.appendChild(s)})}
function update(){$('turn').textContent=players[turn].name;$('scores').innerHTML=players.map((p,i)=>'<span class="score">'+p.name+': '+p.pos+'</span>').join('');pieces()}
function roll(){dice=1+Math.floor(Math.random()*6);$('die').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][dice-1];targetColor=Math.min(players[turn].pos+dice,47)%6;$('levels').classList.remove('hidden');$('roll').disabled=true}
function pick(l,t){const a=POOLS[l][t],u=used[l][t];let av=a.map((_,i)=>i).filter(i=>!u.includes(i));if(!av.length){used[l][t]=[];av=a.map((_,i)=>i)}const ix=av[Math.floor(Math.random()*av.length)];used[l][t].push(ix);return a[ix]}
function card(l){$('rows').innerHTML='';COLORS.forEach((c,i)=>{const r=document.createElement('div');r.className='row '+c[0]+(i===targetColor?' active':'');r.innerHTML='<div class="ico">'+c[1]+'</div><div class="word"><span>'+pick(l,c[3])+'</span><span class="act">'+c[2]+'</span></div>';$('rows').appendChild(r)});$('ctitle').textContent='KARTA '+l;$('target').textContent='HRAJE SE: '+COLORS[targetColor][2].toUpperCase();guesser=null;$('guessers').innerHTML='';players.forEach((p,i)=>{if(i===turn)return;const b=document.createElement('button');b.className='guess';b.textContent=p.name;b.onclick=()=>{guesser=i;document.querySelectorAll('.guess').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('guessers').appendChild(b)});$('levels').classList.add('hidden');$('cardStep').classList.remove('hidden')}
function finish(ok){if(ok){players[turn].pos=Math.min(47,players[turn].pos+dice);if(guesser!==null)players[guesser].pos=Math.min(47,players[guesser].pos+1)}update();const w=players.find(p=>p.pos>=47);if(w){setTimeout(()=>alert('🏆 Vyhrává '+w.name+'!'),50);return}turn=(turn+1)%players.length;dice=0;guesser=null;$('roll').disabled=false;$('levels').classList.add('hidden');$('cardStep').classList.add('hidden');update()}
$('count').addEventListener('change',names);$('start').addEventListener('click',start);$('roll').addEventListener('click',roll);document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>card(+b.dataset.level)));$('ok').addEventListener('click',()=>finish(true));$('no').addEventListener('click',()=>finish(false));$('reset').addEventListener('click',()=>location.reload());names();
</script></body></html>
