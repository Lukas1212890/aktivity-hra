<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1565a8"><title>Aktivity</title><style>
:root{--y:#ffd83d;--c:#56c9ef;--p:#c55bd8;--g:#65c657;--b:#176ac2;--o:#f28a35;--ink:#172033}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(#74cef4 0 170px,#dff4c7 420px,#f5dfaa 100%);min-height:100vh}button,input,select{font:inherit}button{border:0;font-weight:900;cursor:pointer}main{max-width:980px;margin:auto;padding:10px}.hidden{display:none!important}.hero{text-align:center;padding:8px 8px 2px}.logo{font-size:clamp(42px,10vw,78px);line-height:.9;font-weight:1000;letter-spacing:-4px;color:#ffc52f;-webkit-text-stroke:3px #0d4f96;text-shadow:0 5px 0 #07396d,0 8px 14px #0003}.tag{font-weight:900;color:#174e82;letter-spacing:1px;margin-top:8px}.panel{background:#fffdf5eF;border:3px solid #fff;border-radius:24px;padding:15px;margin:10px 0;box-shadow:0 7px 0 #714b2b44,0 12px 24px #0002}.setup{max-width:600px;margin:20px auto}.names{display:grid;gap:8px;margin:12px 0}.name,select{width:100%;padding:13px;border:2px solid #d9c79d;border-radius:13px;background:#fff;font-size:16px}.primary,.roll{padding:14px 18px;border-radius:14px;background:linear-gradient(#49bd5a,#238e39);color:white;box-shadow:0 4px 0 #176b2a}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.turnbox{background:#fff2bc;border-radius:15px;padding:9px 13px}.turn{font-size:22px;font-weight:1000}.scores{display:flex;gap:7px;flex-wrap:wrap}.score{background:white;border:2px solid #ead9b2;border-radius:13px;padding:7px 10px;font-weight:900}.boardWrap{position:relative;overflow:hidden;background:linear-gradient(#bfeaff 0 28%,#b8dc85 28% 62%,#e9cf8a 62%);border-radius:24px;padding:18px 10px 20px;min-height:390px}.scene{position:absolute;inset:0;pointer-events:none;font-size:44px;opacity:.9}.m1{position:absolute;left:3%;top:7%}.m2{position:absolute;right:4%;top:8%}.m3{position:absolute;left:10%;bottom:9%}.m4{position:absolute;right:8%;bottom:8%}.m5{position:absolute;left:47%;top:34%;font-size:56px}.board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;z-index:2}.cell{min-width:0;min-height:54px;border:3px solid white;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #0002;font-weight:1000}.cell:nth-child(12n+7){grid-column:6}.c0{background:var(--y)}.c1{background:var(--c)}.c2{background:var(--p);color:white}.c3{background:var(--g)}.c4{background:var(--b);color:white}.c5{background:var(--o)}.num{font-size:9px;opacity:.5}.ico{font-size:18px}.pieces{display:flex;gap:1px;flex-wrap:wrap;justify-content:center}.piece{width:22px;height:22px;border-radius:50%;border:2px solid white;color:white;font-size:9px;display:grid;place-items:center;box-shadow:0 2px 3px #0005}.p0{background:#d82f39}.p1{background:#176ac2}.p2{background:#2d9d47}.p3{background:#7b3db4}.playPanel{background:#fffdf5}.dicebox{display:flex;justify-content:space-between;align-items:center;gap:10px}.die{font-size:66px;line-height:1}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.level{padding:16px;border-radius:15px;color:white;font-size:27px;box-shadow:0 4px 0 #0003}.level[data-level="3"]{background:#39ae4c}.level[data-level="4"]{background:#2676ca}.level[data-level="5"]{background:#d93843}.muted{opacity:.62}.card{border-radius:20px;overflow:hidden;border:3px solid #e7d7ae;background:white}.head{background:#194f88;color:white;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:1000}.timer{font-variant-numeric:tabular-nums;background:#fff;color:#183c62;border-radius:999px;padding:7px 11px;font-size:20px}.timer.danger{background:#d9363e;color:#fff;animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.row{display:grid;grid-template-columns:48px 1fr;min-height:58px;border-bottom:1px solid #0001}.rowIcon{display:grid;place-items:center;font-size:23px}.word{display:flex;align-items:center;jus </style></head><body><main><div class="hero"><div class="logo">AKTIVITY</div><div class="tag">ZÁBAVA, KTERÁ SPOJUJE</div></div>
<section id="setup" class="panel setup"><h2>🎲 Nová hra</h2><label>Počet hráčů<select id="count"><option value="3">3 hráči</option><option value="4">4 hráči</option></select></label><div id="names" class="names"></div><button id="start" class="primary" style="width:100%">ZAČÍT DOBRODRUŽSTVÍ</button></section>
<section id="game" class="hidden"><div class="panel top"><div class="turnbox"><div class="muted">👑 Na tahu</div><div id="turn" class="turn"></div></div><div id="scores" class="scores"></div><button id="reset" class="smallbtn">Nová hra</button></div>
<div class="panel"><div class="boardWrap"><div class="scene"><span class="m1">🏔️🌲</span><span class="m2">🏰</span><span class="m3">🌊⛵</span><span class="m4">🏜️🌴</span><span class="m5">🌉</span></div><div class="startSign">START</div><div class="finishSign">🏆 CÍL</div><div id="board" class="board"></div></div><div class="legend"><span>🎨 kreslení</span><span>💬 mluvení</span><span>🎭 pantomima</span></div></div>
<div class="panel playPanel"><div id="diceStep" class="dicebox"><div><b>1. Hoď kostkou</b><div class="muted">Když uspěješ, jdeš o hozený počet polí.</div></div><div style="text-align:center"><div id="die" class="die">⚀</div><button id="roll" class="roll">HODIT KOSTKOU</button></div></div><div id="levels" class="hidden"><b>2. Vyber obtížnost karty</b><div class="muted">Výběrem se okamžitě spustí 60 sekund.</div><div class="levels"><button class="level" data-level="3">3</button><button class="level" data-level="4">4</button><button class="level" data-level="5">5</button></div></div><div id="cardStep" class="hidden"><div class="card"><div class="head"><span id="ctitle"></span><span id="target"></span><span id="timer" class="timer">1:00</span></div><div id="rows"></div></div><div id="timeup" class="timeup hidden">⏰ ČAS VYPRŠEL!</div><p><b>Kdo pojem uhodl?</b> <span class="muted">Hádač získá +1 pole.</span></p><div id="guessers" class="guessers"></div><div class="result"><button id="ok" class="ok">✓ UHODNUTO</button><button id="no" class="no">✕ NEUHODNUTO</button></div></div></div></section></main>
<script>
const $=x=>document.getElementById(x), COLORS=[['c0','🎨','Kreslení','draw'],['c1','💬','Mluvení','talk'],['c2','🎭','Pantomima','mime'],['c3','🎨','Kreslení','draw'],['c4','💬','Mluvení','talk'],['c5','🎭','Pantomima','mime']];
const P={3:{draw:['Kompas','Traktor','Akvárium','Rozhledna','Pirátská loď','Horkovzdušný balón','Ptačí budka','Větrný mlýn','Semafor','Dalekohled','Sněhulák','Slunečnice','Vesmírná raketa','Kurník','Přístav','Plachetnice','Knihovna','Stromový domek','Pískoviště','Stodola','Kávovar','Kytara','Fotoaparát','Žebřík','Padák','Maják','Vodopád','Hrad','Skleník','Vrtulník'],talk:['Reklamace','Spropitné','Omluva','Záruka','Přezdívka','Spolubydlící','Výplata','Zpoždění','Fronta','Pokuta','Překvapení','Tajemství','Sázka','Pověra','Sleva','Zásilka','Kapesné','Pohovor','Záloha','Výpověď','Telefonát','Objednávka','Rezervace','Doručení','Soutěž','Prázdniny','Vstupenka','Půjčka','Rande','Nájem'],mime:['Škytavka','Zívání','Mrkání','Kulhání','Klování','Šplhání','Fotograf','Boxer','Bubeník','Kadeřník','Kominík','Potápěč','Houslista','Dirigent','Baletka','Kouzelník','Žonglér','Jízda na koni','Čištění zubů','Fénování vlasů','Vytírání podlahy','Sekání trávy','Venčení psa','Zavazování tkaniček','Loupání banánu','Mytí oken','Řízení auta','Vysávání','Žehlení','Foukání svíček']},4:{draw:['Polární záře','Ledoborec','Měsíční kráter','Observatoř','Padací most','Visutý most','Ropná plošina','Vesmírná družice','Gejzír','Katapult','Akvadukt','Zatmění Slunce','Vodní elektrárna','Ledovec','Amfiteátr','Vzducholoď','Archeologické naleziště','Meteorologická stanice','Ponorkový periskop','Potopený poklad','Tajná chodba','Černá díra','Oko hurikánu','Důlní šachta','Podzemní bunkr','Přehrada','Ledová jeskyně','Vesmírná stanice','Zvedací most','Vodní příkop'],talk:['Zkušební doba','Nouzový východ','Slepá důvěra','Inkognito','Protekce','Prodloužení smlouvy','Anonymní svědek','Podmíněný trest','Dědictví','Předplatné','Autorské právo','Amnestie','Vydědění','Domovní prohlídka','Cenzura','Patent','Embargo','Prognóza','Kauza','Konkurs','Mandát','Kompromis','Privilegium','Vedlejší účinek','Bod zlomu','Krizová situace','Diplomatická imunita','Výběrové řízení','Pojistná událost','Bankrot'],mime:['Hypnotizovat','Omdlévání','Kaskadér','Loutkář','Dražitel','Someliér','Nosič zavazadel','Ochočit si zvíře','Provazochodec','Krotitel lvů','Balancování','Přetahování lanem','Předstírat spánek','Iluzionista','Restaurátor','Kartograf','Průvodčí','Kovář','Pašerák','Zadržovat smích','Být jako na trní','Přilévat olej do ohně','Plavat proti proudu','Otevírat trezor','Hledat signál','Přelézat plot','Uklouznout na ledu','Rozmotávat kabel','Pumpovat pneumatiku','Přecházet po kládě']},5:{draw:['Schrödingerova kočka','Gordický uzel','Damoklův meč','Pandořina skříňka','Fata morgána','Babylonská věž','Möbiova páska','Červí díra','Tektonický zlom','Magnetické pole','Perpetuum mobile','Ztracená civilizace','Časová smyčka','Most mezi světy','Ztracený ráj','Dům z karet','Labyrint zrcadel','Sisyfův kámen','Newtonovo kyvadlo','Kvantový tunel','Optický klam','Nekonečné schodiště','Město pod hladinou','Stroj času','Dvojitá spirála','Kruhy v obilí','Mechanické srdce','Ostrov ve vzduchu','Obrácený vodopád','Hodiny bez ručiček'],talk:['Kognitivní disonance','Sebenaplňující proroctví','Klam přeživších','Existenciální krize','Presumpce neviny','Status quo','Precedent','Kolektivní vina','Oportunismus','Suverenita','Pyrrhovo vítězství','Morální dilema','Důkazní břemeno','Konflikt svědomí','Střet hodnot','Nechtěný důsledek','Veřejné tajemství','Dvojí metr','Efekt motýlích křídel','Osudová chyba','Právo veta','Paradox volby','Politický azyl','Kauzalita','Etický kodex','Společenská smlouva','Mocenské vakuum','Informační asymetrie','Stádní efekt','Teorie chaosu'],mime:['Přeskočit vlastní stín','Házet flintu do žita','Chodit kolem horké kaše','Tančit jak někdo píská','Dělat z komára velblouda','Chytat druhý dech','Ztratit nit','Zachovat chladnou hlavu','Chodit po špičkách','Bojovat sám se sebou','Ztratit tvář','Chytat se stébla','Házet hrách na zeď','Plavat proti proudu','Přilévat olej do ohně','Mít máslo na hlavě','Šlápnout vedle','Za pět minut dvanáct','Být jako na trní','Ztratit půdu pod nohama','Boj s větrnými mlýny','Zakázané ovoce','Kámen úrazu','Ticho před bouří','Oko hurikánu','Časovaná bomba','Konec světa','Útěk z vězení','Záchvat paniky','Mozková bouře']}};
let players=[],turn=0,dice=0,target=0,guesser=null,used={},timerId=null,left=60;const diceChars=['⚀','⚁','⚂','⚃','⚄','⚅'];
function names(){let n=+$('count').value;$('names').innerHTML='';for(let i=0;i<n;i++){let x=document.createElement('input');x.className='name';x.placeholder='Jméno hráče '+(i+1);x.value=['Petr','Lenka','Tomáš','Eva'][i];$('names').appendChild(x)}}
function start(){players=[...document.querySelectorAll('.name')].map((x,i)=>({name:x.value.trim()||'Hráč '+(i+1),pos:0}));$('setup').classList.add('hidden');$('game').classList.remove('hidden');build();update()}
function build(){let b=$('board');b.innerHTML='';for(let i=0;i<48;i++){let c=document.createElement('div'),k=i%6;c.className='cell c'+k;c.innerHTML='<span class="num">'+(i+1)+'</span><span class="ico">'+COLORS[k][1]+'</span><div class="pieces" id="pc'+i+'"></div>';b.appendChild(c)}}
function update(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');players.forEach((p,i)=>{let e=document.createElement('span');e.className='piece p'+i;e.textContent=i+1;$('pc'+p.pos).appendChild(e)});$('turn').textContent=players[turn]?.name||'';$('scores').innerHTML=players.map((p,i)=>'<span class="score">'+['🔴','🔵','🟢','🟣'][i]+' '+p.name+' · '+p.pos+'</span>').join('')}
function roll(){dice=1+Math.floor(Math.random()*6);$('die').textContent=diceChars[dice-1];target=(players[turn].pos+dice)%6;$('roll').disabled=true;$('levels').classList.remove('hidden')}
function pick(l,t){let a=P[l][t],key=l+t;if(!used[key]||used[key].length>=a.length)used[key]=[];let ix;do ix=Math.floor(Math.random()*a.length);while(used[key].includes(ix));used[key].push(ix);return a[ix]}
function card(l){clearTimer();$('rows').innerHTML='';COLORS.forEach((c,i)=>{let r=document.createElement('div');r.className='row '+c[0]+(i===target?' active':'');r.innerHTML='<div class="rowIcon">'+c[1]+'</div><div class="word"><span>'+pick(l,c[3])+'</span><span class="act">'+c[2]+'</span></div>';$('rows').appendChild(r)});$('ctitle').textContent='KARTA '+l;$('target').textContent='HRAJE SE: '+COLORS[target][2].toUpperCase();guesser=null;$('guessers').innerHTML='';players.forEach((p,i)=>{if(i===turn)return;let b=document.createElement('button');b.className='guess';b.textContent=p.name;b.addEventListener('click',()=>{guesser=i;document.querySelectorAll('.guess').forEach(x=>x.classList.remove('on'));b.classList.add('on')});$('guessers').appendChild(b)});$('levels').classList.add('hidden');$('cardStep').classList.remove('hidden');$('timeup').classList.add('hidden');startTimer()}
function startTimer(){left=60;drawTimer();timerId=setInterval(()=>{left--;drawTimer();if(left<=0){clearTimer();$('timeup').classList.remove('hidden')}},1000)}function drawTimer(){let t=$('timer');t.textContent='0:'+String(left).padStart(2,'0');t.classList.toggle('danger',left<=10)}function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function finish(ok){clearTimer();if(ok){players[turn].pos=Math.min(47,players[turn].pos+dice);if(guesser!==null)players[guesser].pos=Math.min(47,players[guesser].pos+1)}update();let w=players.find(p=>p.pos>=47);if(w){setTimeout(()=>alert('🏆 Vyhrává '+w.name+'!'),50);return}turn=(turn+1)%players.length;dice=0;guesser=null;$('roll').disabled=false;$('levels').classList.add('hidden');$('cardStep').classList.add('hidden');update();window.scrollTo({top:0,behavior:'smooth'})}
$('count').addEventListener('change',names);$('start').addEventListener('click',start);$('roll').addEventListener('click',roll);document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>card(+b.dataset.level)));$('ok').addEventListener('click',()=>finish(true));$('no').addEventListener('click',()=>finish(false));$('reset').addEventListener('click',()=>{clearTimer();location.reload()});names();
</script></body></html>
